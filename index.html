<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b194d">
    
    <meta http-equiv="refresh" content="0; url=home.html">
    
    <script>
        // ब्याकअप रिडाइरेक्ट लजिक
        window.location.href = "home.html";

        // Service Worker रजिस्टर गर्ने (इन्स्टल गराउनका लागि)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker Registered!'))
                .catch(err => console.log('Service Worker Failed!', err));
            });
        }
    </script>
</head>
<body style="background-color: #0c1a40; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="text-align: center; font-family: Arial, sans-serif; color: white;">
        <p>Loading Game...</p>
    </div>
</body>
</html>
