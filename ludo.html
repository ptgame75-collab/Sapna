<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="main-container">
        <div class="top-bar ludo-top-bar">
            <a href="home.html" class="back-btn">⬅ ब्याक</a>
            <div class="icons">
                <span>📶</span><span>🔋</span>
            </div>
        </div>

        <div class="board-container">
            <div class="ludo-board">
                <div class="house red-house">
                    <div class="box red"></div>
                </div>

                <div class="track top-track">
                    <div class="cell"></div><div class="cell yellow-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell yellow-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell yellow-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell yellow-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell yellow-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell yellow-path"></div><div class="cell"></div>
                </div>

                <div class="house yellow-house">
                    <div class="box yellow"></div>
                </div>

                <div class="track left-track">
                    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div>
                    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                </div>

                <div class="center-home"></div>

                <div class="track right-track">
                    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <div class="cell green-path"></div><div class="cell green-path"></div><div class="cell green-path"></div><div class="cell green-path"></div><div class="cell green-path"></div><div class="cell green-path"></div>
                    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                </div>

                <div class="house blue-house">
                    <div class="box blue"></div>
                </div>

                <div class="track bottom-track">
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                </div>

                <div class="house green-house">
                    <div class="box green"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
