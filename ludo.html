<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board - Fixed Layout</title>
    <link rel="stylesheet" href="./ludo.css">
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="home.html" class="back-btn">⬅ ब्याक</a>
            <div class="icons">
                <span>📶</span><span>🔋</span>
            </div>
        </div>

        <div class="board-container">
            <div class="ludo-board">
                
                <div class="house red-house">
                    <div class="box">
                        <div class="pocket red-bg"></div><div class="pocket red-bg"></div>
                        <div class="pocket red-bg"></div><div class="pocket red-bg"></div>
                    </div>
                </div>

                <div class="track top-track">
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell safe-zone white-star">★</div><div class="cell blue-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell blue-path"></div><div class="cell blue-start-cell black-star">★</div>
                </div>

                <div class="house blue-house">
                    <div class="box">
                        <div class="pocket blue-bg"></div><div class="pocket blue-bg"></div>
                        <div class="pocket blue-bg"></div><div class="pocket blue-bg"></div>
                    </div>
                </div>

                <div class="track left-track">
                    <div class="cell"></div><div class="cell red-start-cell black-star">★</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div><div class="cell red-path"></div>
                    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell safe-zone white-star">★</div><div class="cell"></div>
                </div>

                <div class="center-home">
                    <div class="triangle red-triangle"></div>
                    <div class="triangle blue-triangle"></div>
                    <div class="triangle green-triangle"></div>
                    <div class="triangle yellow-triangle"></div>
                </div>

                <div class="track right-track">
                    <div class="cell"></div><div class="cell safe-zone white-star">★</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                    <div class="cell yellow-path"></div><div class="cell yellow-path"></div><div class="cell yellow-path"></div><div class="cell yellow-path"></div><div class="cell yellow-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell yellow-start-cell black-star">★</div><div class="cell"></div>
                </div>

                <div class="house green-house">
                    <div class="box">
                        <div class="pocket green-bg"></div><div class="pocket green-bg"></div>
                        <div class="pocket green-bg"></div><div class="pocket green-bg"></div>
                    </div>
                </div>

                <div class="track bottom-track">
                    <div class="cell green-start-cell black-star">★</div><div class="cell green-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell green-path"></div><div class="cell safe-zone white-star">★</div>
                    <div class="cell"></div><div class="cell green-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell green-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell green-path"></div><div class="cell"></div>
                    <div class="cell"></div><div class="cell green-path"></div><div class="cell"></div>
                </div>

                <div class="house yellow-house">
                    <div class="box">
                        <div class="pocket yellow-bg"></div><div class="pocket yellow-bg"></div>
                        <div class="pocket yellow-bg"></div><div class="pocket yellow-bg"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
