<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game - Home</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b194d">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <span>13:23</span>
            <div class="icons">
                <span>📶</span><span>🔋</span>
            </div>
        </div>
        <div class="title-bar">
            <h1>LUDO GAME</h1>
            <div class="right-icon">⬡</div>
        </div>
        <div class="content">
            <p class="game-mode">GAME MODE<br>(BATTLE)</p>
            <button class="btn" onclick="openColorModal('1v1')">1V1</button>
            <button class="btn" onclick="openColorModal('4player')">4 PLAYER</button>
        </div>

        <div id="colorModal" class="modal-overlay">
            <div class="modal-box">
                <h2>CHOOSE YOUR COLOR</h2>
                <div class="color-options">
                    <div class="color-circle red" onclick="selectColor('red')"></div>
                    <div class="color-circle blue" onclick="selectColor('blue')"></div>
                    <div class="color-circle green" onclick="selectColor('green')"></div>
                    <div class="color-circle yellow" onclick="selectColor('yellow')"></div>
                </div>
                <button class="close-btn" onclick="closeColorModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        let selectedMode = '';

        function openColorModal(mode) {
            selectedMode = mode;
            document.getElementById('colorModal').style.display = 'flex';
        }

        function closeColorModal() {
            document.getElementById('colorModal').style.display = 'none';
        }

        function selectColor(color) {
            // छानेको रङ र मोडलाई अर्को पेज (ludo.html) मा पठाउन युआरएल (URL) मा जोडिएको छ
            window.location.href = `./ludo.html?mode=${selectedMode}&color=${color}`;
        }
    </script>
</body>
</html>
