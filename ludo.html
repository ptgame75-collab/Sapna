<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>
    <link rel="stylesheet" href="./ludo.css">
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="home.html" class="back-btn">⬅ BACK</a>
            <div>Player: <span id="currentPlayer">Red</span></div>
            <div class="icons">
                <span>📶</span><span>🔋</span>
            </div>
        </div>

        <div class="board-container">
            <div class="ludo-board" id="board">
                <!-- Board cells will be generated by JS or kept static -->
                <!-- तिम्रो पुरानो board cells राख्न सक्छौ, मलाई भन भने म JS बाट dynamic बनाउँछु -->
            </div>
        </div>

        <!-- Controls -->
        <div style="padding: 15px; text-align: center; background: #0c1a40; color: white;">
            <div id="dice" onclick="rollDice()">🎲</div>
            <button onclick="rollDice()" style="padding:12px 30px; font-size:18px; margin-top:10px;">
                Roll Dice
            </button>
            <p id="status">तिम्रो पालो! Dice थिच्नुहोस्</p>
        </div>
    </div>

    <script>
        // URL बाट color र mode लिने
        const params = new URLSearchParams(window.location.search);
        const playerColor = params.get('color') || 'red';
        const gameMode = params.get('mode') || '4player';

        document.getElementById('currentPlayer').textContent = playerColor.toUpperCase();

        let currentDice = 1;

        function rollDice() {
            const diceEl = document.getElementById('dice');
            currentDice = Math.floor(Math.random() * 6) + 1;
            
            diceEl.style.transition = 'none';
            diceEl.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][currentDice-1];
            
            // Animation
            setTimeout(() => {
                diceEl.style.transition = 'transform 0.3s';
            }, 10);

            document.getElementById('status').textContent = `तिमीले ${currentDice} पाएका छौ!`;
            
            // यहाँ piece move logic आउँछ (अर्को स्टेपमा)
            console.log(`Rolled: ${currentDice} | Color: ${playerColor}`);
        }

        // Board initialization (अहिले static, पछि dynamic बनाउन सकिन्छ)
        console.log('Ludo Board Loaded - Mode:', gameMode, 'Color:', playerColor);
    </script>
</body>
</html>
