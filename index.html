<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b194d">
    
    <meta http-equiv="refresh" content="0; url=home.html">
    
    <script>
        window.location.href = "home.html";
        
        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Error:', err));
            });
        }
    </script>
</head>
<body style="background-color: #0c1a40; margin:0; height:100vh; display:flex; justify-content:center; align-items:center; color:white; font-family:Arial;">
    <div style="text-align:center;">
        <h2>Loading Ludo Game...</h2>
    </div>
</body>
</html>
