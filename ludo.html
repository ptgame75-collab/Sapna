<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>
    <link rel="stylesheet" href="ludo.css">
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="home.html" style="color:black; text-decoration:none;">← BACK</a>
            <div id="current-turn">Red को पालो</div>
        </div>

        <div class="board-container">
            <div class="ludo-board" id="board">
                <!-- JS बाट board cells भर्नेछौं -->
            </div>
        </div>

        <div class="controls">
            <div id="dice" onclick="rollDice()">🎲</div>
            <button onclick="rollDice()" style="padding:12px 40px; font-size:18px;">ROLL DICE</button>
            <p id="status">Dice थिच्नुहोस्</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
